# Banco separado, em memoria, apenas para os testes.
#
# O perfil dev usa H2 em arquivo para os dados sobreviverem ao restart. Se os
# testes usassem esse mesmo banco, o usuario cadastrado numa execucao
# quebraria a seguinte com 409, e o resultado dependeria de execucao anterior.
spring.datasource.url=jdbc:h2:mem:testes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

api.security.jwt.secret=segredo-apenas-para-tes-autenticados-000000000
api.security.jwt.expiration=3600000
security.rate-limit.login.requests=500
security.rate-limit.registration.requests=500
api.cors.allowed-origins=http://localhost:3000

# O application.properties de teste substitui o de main no classpath; por isso,
# os testes que cobrem agendamento precisam declarar o expediente explicitamente.
api.agendamento.expediente.horarios.MONDAY=08:00-19:00
api.agendamento.expediente.horarios.TUESDAY=08:00-19:00
api.agendamento.expediente.horarios.WEDNESDAY=08:00-19:00
api.agendamento.expediente.horarios.THURSDAY=08:00-19:00
api.agendamento.expediente.horarios.FRIDAY=08:00-19:00
api.agendamento.expediente.horarios.SATURDAY=07:00-16:00
