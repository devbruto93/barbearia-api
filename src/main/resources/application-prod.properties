# --- Segredos: obrigatorios, sem valor padrao ---
# Se JWT_SECRET nao estiver definida, a aplicacao falha na subida em vez de
# usar uma chave fraca. Falhar cedo e melhor do que expor um segredo.
api.security.jwt.secret=${JWT_SECRET}
spring.datasource.password=${DB_PASSWORD}

# --- Banco de dados ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.driverClassName=org.postgresql.Driver

# Flyway pode usar uma identidade com permissao de DDL separada da identidade
# da aplicacao. Se nao forem informadas, reutiliza as credenciais do datasource.
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}

# validate nao cria nem altera tabela. O esquema passa a ser responsabilidade
# de migracao versionada, e nao do Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Restricao de sobreposicao usa recursos especificos do PostgreSQL.
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql

# A documentacao interativa nao deve ficar exposta em producao.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Front-end ---
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

logging.level.org.springframework.security=INFO
# Configure `SERVER_SSL_ENABLED=true` and a PKCS12 keystore in production.
server.ssl.enabled=${TLS_ENABLED:true}
server.ssl.key-store=${TLS_KEY_STORE:file:/run/secrets/api.p12}
server.ssl.key-store-password=${TLS_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=api
