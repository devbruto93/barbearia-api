# H2 em arquivo: os dados sobrevivem ao restart. Em modo memoria (jdbc:h2:mem)
# tudo era apagado a cada subida, o que obrigava a recadastrar usuario sempre.
spring.datasource.url=jdbc:h2:file:./data/barbearia;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Segredo apenas de desenvolvimento. Este valor esta no git de proposito: ele
# nao protege nada e nao pode ser reutilizado em producao.
api.security.jwt.secret=chave-de-desenvolvimento-nao-use-em-producao-000000
