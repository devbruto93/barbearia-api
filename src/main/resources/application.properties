spring.application.name=barbearia-api
server.port=8080

# Perfil padrao: o comando mais simples, ./mvnw spring-boot:run, funciona sem
# argumento nenhum. Em producao o perfil DEVE ser informado explicitamente
# (--spring.profiles.active=prod), senao a aplicacao sobe com o H2 de dev.
spring.profiles.default=dev

spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html

api.security.jwt.expiration=3600000

# Duracao padrao de cada atendimento, em minutos. Horarios consecutivos sao permitidos.
api.agendamento.duracao-minutos=30

# Origens autorizadas a chamar a API pelo navegador. A lista e separada por virgula.
api.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.org.springframework.security=INFO
