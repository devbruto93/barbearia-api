spring.application.name=barbearia-api
server.port=8080

# Perfil padrao: o comando mais simples, ./mvnw spring-boot:run, funciona sem
# argumento nenhum. Em producao o perfil DEVE ser informado explicitamente
# (--spring.profiles.active=prod), senao a aplicacao sobe com o H2 de dev.
spring.profiles.default=dev

spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html

api.security.jwt.expiration=3600000

# Duracao padrao de cada atendimento, em minutos. Horarios consecutivos sao permitidos.
api.agendamento.duracao-minutos=30

# Expediente semanal. Dias sem faixa configurada ficam fechados.
# Formato: HH:mm-HH:mm (o atendimento precisa terminar ate o fechamento).
api.agendamento.expediente.horarios.MONDAY=08:00-19:00
api.agendamento.expediente.horarios.TUESDAY=08:00-19:00
api.agendamento.expediente.horarios.WEDNESDAY=08:00-19:00
api.agendamento.expediente.horarios.THURSDAY=08:00-19:00
api.agendamento.expediente.horarios.FRIDAY=08:00-19:00
api.agendamento.expediente.horarios.SATURDAY=07:00-16:00

# Origens autorizadas a chamar a API pelo navegador. A lista e separada por virgula.
api.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.org.springframework.security=INFO
