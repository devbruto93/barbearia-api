services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barbearia
      POSTGRES_USER: ${DB_USERNAME:-barbearia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/barbearia
      DB_URL: jdbc:postgresql://db:5432/barbearia
      DB_USERNAME: ${DB_USERNAME:-barbearia}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SERVER_SSL_ENABLED: ${TLS_ENABLED:-false}
      SERVER_SSL_KEY_STORE: ${TLS_KEY_STORE:-file:/run/secrets/api.p12}
      SERVER_SSL_KEY_STORE_PASSWORD: ${TLS_KEY_STORE_PASSWORD:-}
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: api
      RATE_LIMIT_TRUST_FORWARDED_HEADERS: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:-false}
      DATA_RETENTION_APPOINTMENTS_DAYS: ${DATA_RETENTION_APPOINTMENTS_DAYS:-0}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
    volumes:
      - ./certs:/run/secrets:ro
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
